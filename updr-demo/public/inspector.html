<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPDR Inspector</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="topbar"><div class="brand"><div class="brand-mark">M</div><div><h1>MAPAF UPDR Demo</h1><p>Mobile inspector experience</p></div></div><nav class="nav"><a href="/admin.html">Admin</a><a class="active" href="/inspector.html">Inspector</a><a href="/qc.html">QC</a></nav></div>
<main class="page"><div class="mobile-shell"><div class="mobile-header"><h2 style="margin:0">Inspector Workspace</h2><p style="margin:6px 0 0;color:#aeb8c7">Mobile automation · AI evidence · offline recovery</p></div><div class="mobile-body">
<button class="btn btn-primary" data-testid="load-order">Load assigned order</button><div class="grid grid-2" style="margin-top:14px"><div class="evidence-item"><div class="label">Order</div><div class="value" data-testid="order-id">—</div></div><div class="evidence-item"><div class="label">Template</div><div class="value" data-testid="template-id-display">—</div></div></div><div class="evidence-item" style="margin-top:10px"><div class="label">Property + MLS</div><div class="value" data-testid="property-summary">—</div></div>
<hr style="border:0;border-top:1px solid #d8e0e8;margin:20px 0"><div class="field"><label>Exterior damage present?</label><select data-testid="damage-present"><option value="NO">No</option><option value="YES">Yes</option></select></div>
<div data-testid="conditional-fields" class="hidden"><div class="field"><label>Defect type</label><input data-testid="defect-type"></div><div class="field"><label>Material</label><input data-testid="material"></div><div class="field"><label>Severity</label><select data-testid="severity"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select></div><div class="field"><label>Repair estimate</label><input data-testid="repair-estimate" placeholder="$2,500"></div></div>
<div class="actions"><button class="btn btn-secondary" data-testid="analyze-photo">Analyze initial photo</button><button class="btn btn-secondary" data-testid="duplicate-photo">Check duplicate</button><button class="btn btn-secondary" data-testid="replacement-photo">Analyze replacement</button><button class="btn btn-secondary" data-testid="confirm-ai">Confirm AI finding</button><button class="btn btn-secondary" data-testid="analyze-voice">Analyze voice</button></div>
<div class="grid grid-2" style="margin-top:14px"><div class="evidence-item"><div class="label">Photo quality</div><div class="value" data-testid="quality-score">0</div></div><div class="evidence-item"><div class="label">AI confidence</div><div class="value" data-testid="photo-confidence">0%</div></div></div><div class="evidence-item" style="margin-top:10px"><div class="label">Voice transcript</div><div class="value" data-testid="voice-transcript">Not analyzed</div></div>
<div class="field" style="margin-top:14px"><label>Moisture source</label><select data-testid="moisture-source"><option value="">Select...</option><option value="FAILED_WINDOW_SEAL">Failed window seal</option><option value="PLUMBING_LEAK">Plumbing leak</option></select></div>
<div class="actions"><button class="btn btn-secondary" data-testid="autosave-fail">Autosave (simulate failure)</button><button class="btn btn-secondary" data-testid="autosave-retry">Retry sync</button><button class="btn btn-secondary" data-testid="validate-inspection">Validate</button><button class="btn btn-primary" data-testid="submit-inspection">Submit</button><button class="btn btn-secondary" data-testid="refresh-status">Refresh</button></div>
<div style="margin-top:12px" class="banner" data-testid="sync-status">Sync not started</div><div style="margin-top:10px" class="banner" data-testid="validation-status">Not validated</div><div style="margin-top:10px" class="banner banner-warning" data-testid="inspection-status">DRAFT</div><div style="margin-top:10px" class="banner" data-testid="qc-comment-display">No QC comments</div>
</div></div></main>
<script src="/app.js"></script><script>(()=>{const {api,el,text,value,show,status}=window.Updr;async function saveSections(){await api('/api/inspections/INSP-1001/sections/exterior',{method:'PATCH',body:JSON.stringify({damagePresent:el('damage-present').value==='YES',defectType:el('defect-type').value,material:el('material').value,severity:el('severity').value,repairEstimate:el('repair-estimate').value})});await api('/api/inspections/INSP-1001/sections/interior',{method:'PATCH',body:JSON.stringify({moistureSource:el('moisture-source').value})})}el('damage-present').onchange=e=>show('conditional-fields',e.target.value==='YES');el('load-order').onclick=async()=>{const o=await api('/api/orders/UPDR-1001');text('order-id',o.orderId);text('template-id-display',o.templateId||'Not assigned');text('property-summary',`${o.property.address} | ${o.mls.listingId} | ${o.mls.squareFeet} sq ft`);const s=await api('/api/inspections/INSP-1001/status');text('inspection-status',s.status);text('qc-comment-display',s.qcComment||'No QC comments')};el('analyze-photo').onclick=async()=>{const a=await api('/api/ai/photos/analyze',{method:'POST',body:'{}'});value('defect-type',a.defect);value('material',a.material);text('quality-score',String(a.qualityScore));text('photo-confidence',`${Math.round(a.confidence*100)}%`);el('damage-present').value='YES';show('conditional-fields',true);status('validation-status','Low-quality photo: replacement and human confirmation required','warning')};el('duplicate-photo').onclick=async()=>{try{await api('/api/ai/photos/analyze',{method:'POST',body:JSON.stringify({duplicate:true})})}catch(e){status('validation-status','Duplicate evidence rejected','danger')}};el('replacement-photo').onclick=async()=>{const a=await api('/api/ai/photos/analyze',{method:'POST',body:JSON.stringify({replacement:true})});text('quality-score',String(a.qualityScore));text('photo-confidence',`${Math.round(a.confidence*100)}%`);status('validation-status','Replacement photo accepted','success')};el('confirm-ai').onclick=async()=>{await api('/api/inspections/INSP-1001/ai-confirmation',{method:'POST',body:'{}'});status('validation-status','AI finding confirmed by inspector','success')};el('analyze-voice').onclick=async()=>{const a=await api('/api/ai/voice/analyze',{method:'POST',body:'{}'});text('voice-transcript',a.transcript);el('severity').value='HIGH';status('validation-status','Voice AI mapped WATER_DAMAGE; moisture source required','warning')};el('autosave-fail').onclick=async()=>{await saveSections();try{await api('/api/inspections/INSP-1001/autosave',{method:'POST',body:JSON.stringify({failOnce:true})})}catch(e){status('sync-status','OFFLINE_PENDING_SYNC · data retained locally','warning');text('inspection-status','OFFLINE_PENDING_SYNC')}};el('autosave-retry').onclick=async()=>{const r=await api('/api/inspections/INSP-1001/autosave',{method:'POST',body:'{}'});status('sync-status',`${r.status} · synchronization recovered`,'success');text('inspection-status',r.status)};el('validate-inspection').onclick=async()=>{await saveSections();try{const r=await api('/api/inspections/INSP-1001/validate',{method:'POST',body:'{}'});status('validation-status',r.status,'success');text('inspection-status',r.status)}catch(e){const msg=e.body?.errors?.map(x=>x.message).join(' | ')||e.message;status('validation-status',`VALIDATION_FAILED · ${msg}`,'danger');text('inspection-status','VALIDATION_FAILED')}};el('submit-inspection').onclick=async()=>{await saveSections();try{const r=await api('/api/inspections/INSP-1001/submit',{method:'POST',body:'{}'});status('validation-status','Submission accepted','success');text('inspection-status',r.status)}catch(e){const msg=e.body?.errors?.map(x=>x.message).join(' | ')||e.message;status('validation-status',`VALIDATION_FAILED · ${msg}`,'danger');text('inspection-status','VALIDATION_FAILED')}};el('refresh-status').onclick=async()=>{const r=await api('/api/inspections/INSP-1001/status');text('inspection-status',r.status);text('qc-comment-display',r.qcComment||'No QC comments')};})();</script></body></html>
