services:
  performance-mock-api:
    build: .
    container_name: mapaf-performance-mock-api
    ports:
      - "8089:8089"
    environment:
      PORT: "8089"
      DEFAULT_DELAY_MS: "0"
      DEFAULT_ERROR_RATE: "0"
      MAX_PAYLOAD_KB: "1024"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/health"]
      interval: 5s
      timeout: 2s
      retries: 10
