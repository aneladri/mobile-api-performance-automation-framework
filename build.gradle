tasks.register('webSelectedBrowserTest') {
    group = 'verification'
    description =
            'Runs Playwright Web tests on browsers selected using -Pbrowser'

    dependsOn selectedWebBrowsers.collect { browser ->
        browserTestTaskByName[browser]
    }

    doFirst {
        println ''
        println 'MAPAF flexible browser selection:'
        println "Browsers executed: ${selectedWebBrowsers.join(', ')}"
        println "  Selected  : ${selectedWebBrowsers.join(', ')}"
        println "  Threads   : ${project.findProperty('webThreads') ?: '4'}"
        println "  Headless  : ${project.findProperty('headless') ?: 'true'}"
        println "  Retry     : ${configuredRetryCount}"
        println ''
    }

    doLast {
        println ''
        println 'MAPAF selected-browser execution completed.'
        println 'Browsers    : CHROMIUM, FIREFOX, WEBKIT'
    }
}

tasks.register('generateSelectedBrowserWebSummaries') {
    group = 'MAPAF Reporting'
    description =
            'Generates summaries only for browsers selected using -Pbrowser'

    dependsOn selectedWebBrowsers.collect { browser ->
        browserSummaryTaskByName[browser]
    }

    doLast {
        println ''
        println 'Selected browser summaries generated:'

        selectedWebBrowsers.each { browser ->
            println "  web/reports/${browser.toLowerCase()}-summary.json"
        }
    }
}

