tasks.register('generateCrossBrowserAggregateSummary', JavaExec) {
    group = 'MAPAF Reporting'
    description =
            'Combines Chromium, Firefox and WebKit summaries into one aggregate report'

    dependsOn 'generateCrossBrowserWebSummaries'
    dependsOn testClasses

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'web.reporting.CrossBrowserSummaryCli'

    args(
            'web/reports/cross-browser-summary.json'
    )

    systemProperty 'mapaf.environment', configuredEnvironment
    systemProperty 'mapaf.build', configuredBuildNumber
    systemProperty 'mapaf.branch', configuredBranch
    systemProperty 'mapaf.commit', configuredCommit

    doFirst {
        println 'Generating cross-browser aggregate summary...'
        println '  Chromium : web/reports/chromium-summary.json'
        println '  Firefox  : web/reports/firefox-summary.json'
        println '  WebKit   : web/reports/webkit-summary.json'
        println '  Output   : web/reports/cross-browser-summary.json'
    }
}

