    commandLine 'curl', '--fail', '--silent', '--show-error', 'http://localhost:8089/health'
}


def performanceBaseUrl = providers.gradleProperty('performanceBaseUrl').orElse('http://localhost:8089')

def configureJMeterEnvironment = { Exec task ->
    def configuredHome = project.findProperty('jmeterHome') ?: System.getenv('JMETER_HOME')
    def configuredBin = project.findProperty('jmeterBin') ?: System.getenv('JMETER_BIN')

    if (configuredHome) {
        task.environment 'JMETER_HOME', configuredHome.toString()
    }
    if (configuredBin) {
        task.environment 'JMETER_BIN', configuredBin.toString()
    }
    task.environment 'BASE_URL', performanceBaseUrl.get()
}

