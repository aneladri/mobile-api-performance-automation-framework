def configuredCommit =
        (project.findProperty('commit')
                ?: System.getenv('GIT_COMMIT')
                ?: System.getenv('BUILD_SOURCEVERSION')
                ?: 'local')
                .toString()  

def configuredOpenDashboard =
        (project.findProperty('openDashboard') ?: 'true')
