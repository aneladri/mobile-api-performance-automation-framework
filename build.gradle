def mapafK6Property = { String name, String fallback ->
    providers.gradleProperty(name).orElse(fallback).get()
}

def configureUpdrK6 = { Exec task, String profile ->
    task.environment 'UPDR_BASE_URL', mapafK6Property('updrBaseUrl', 'http://localhost:8090')
    task.environment 'MAPAF_EXECUTION_ID', mapafK6Property('executionId', "MAPAF-K6-${System.currentTimeMillis()}")
    task.environment 'MAPAF_K6_VUS', mapafK6Property('k6Vus', profile == 'ten-thousand' ? '100' : '1')
    task.environment 'MAPAF_K6_ITERATIONS', mapafK6Property('k6Iterations', profile == 'ten-thousand' ? '10000' : '5')
    task.environment 'MAPAF_K6_DURATION', mapafK6Property('k6Duration', '60s')
    task.environment 'MAPAF_K6_MAX_DURATION', mapafK6Property('k6MaxDuration', '10m')
    task.environment 'MAPAF_K6_ORDER_VUS', mapafK6Property('k6OrderVus', '20')
    task.environment 'MAPAF_K6_AUTOSAVE_VUS', mapafK6Property('k6AutosaveVus', '40')
    task.environment 'MAPAF_K6_AI_VUS', mapafK6Property('k6AiVus', '10')
    task.environment 'MAPAF_K6_SPIKE_RATE', mapafK6Property('k6SpikeRate', '50')
    task.commandLine 'bash', 'performance/scripts/run-updr-platform-profile.sh', projectDir.absolutePath, profile
}

