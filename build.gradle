tasks.register('openPlaywrightDashboard', Exec) {
    group = 'MAPAF Demo'
    description = 'Opens the generated MAPAF dashboard'

    dependsOn 'generateDashboard'

    def dashboardPath =
            layout.projectDirectory
                    .file('dashboard/reports/index.html')
                    .asFile

    onlyIf {
        if (!configuredOpenDashboard) {
            println 'Dashboard auto-open disabled.'
            return false
        }

        if (!dashboardPath.exists()) {
            throw new GradleException(
                    "Dashboard not found: ${dashboardPath.absolutePath}"
            )
        }

        return true
    }

    commandLine 'open', dashboardPath.absolutePath

    doFirst {
        println ''
        println 'Opening dashboard:'
        println "  ${dashboardPath.absolutePath}"
    }
}

