tasks.register('mapafDoctor', JavaExec) {
    // MAPAF v3.0 Sprint 4.1.1 - forward intelligence identifiers
    ['mapaf.intelligence.release.id',
     'mapaf.intelligence.execution.id',
     'mapaf.intelligence.history.retention'].each { key ->
        def value = System.getProperty(key)
        if (value != null && !value.trim().isEmpty()) {
            systemProperty key, value
        }
    }
    group = 'MAPAF Doctor'
    description = 'Runs MAPAF Doctor and publishes platform health reports'

    dependsOn 'compileTestJava'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dashboard.enterprise.doctor.publisher.MapafDoctorPublisher'
    args projectDir.absolutePath
}

