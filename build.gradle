plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.10.2'

    testImplementation 'io.appium:java-client:9.4.0'

    testImplementation 'org.apache.logging.log4j:log4j-api:2.24.3'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.3'

    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    testImplementation 'io.rest-assured:json-schema-validator:5.5.0'

    testImplementation 'io.qameta.allure:allure-testng:2.29.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.1'
}

tasks.withType(Test).configureEach {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useTestNG() {
    }

    systemProperty "allure.results.directory", "$buildDir/allure-results"

    outputs.upToDateWhen { false }
}

test {
    useTestNG() {
        suites 'testng.xml'
    }
}

tasks.register('apiTest', Test) {
    description = 'Runs API TestNG suite'
    group = 'verification'

    testLogging {
        showStandardStreams = true
        events 'passed', 'skipped', 'failed', 'standardOut', 'standardError'
        exceptionFormat = 'full'
    }

    useTestNG() {
        suites 'testng-api.xml'
    }
}

tasks.register('mobileTest', Test) {
    description = 'Runs Mobile TestNG suite'
    group = 'verification'

    useTestNG() {
        suites 'testng-mobile.xml'
    }
}

tasks.register('regressionTest', Test) {
    description = 'Runs Regression TestNG suite'
    group = 'verification'

    useTestNG() {
        suites 'testng-regression.xml'
    }
}

tasks.register('iosTest', Test) {
    useTestNG() {
        suites 'testng-ios.xml'
    }

}

tasks.register('aiTest', Test) {
    useTestNG() {
        suites 'testng-ai.xml'
    }
}

tasks.register('flowDemoTest', Test) {
    description = 'Runs the multi-step Appium navigation flow demo'
    group = 'MAPAF Demo'

    testLogging {
        showStandardStreams = true
        events "standardOut", "standardError"
    }

    useTestNG() {
        suites 'testng-flow-demo.xml'
    }
}

tasks.register('failureDemoTest', Test) {
    description = 'Runs a deliberate, deterministic failure for showing a real failure report'
    group = 'MAPAF Demo'
    ignoreFailures = true

    testLogging {
        showStandardStreams = true
        events "standardOut", "standardError"
    }

    useTestNG() {
        suites 'testng-failure-demo.xml'
    }
}

tasks.register('healingDemoTest', Test) {
    description = 'Runs the Tier 3 AI self-healing demo test'
    group = 'MAPAF Demo'

    systemProperty "waitTimeoutSeconds", project.findProperty("waitTimeoutSeconds") ?: "15"

    testLogging {
        showStandardStreams = true
        events "standardOut", "standardError"
    }

    useTestNG() {
        suites 'testng-healing-demo.xml'
    }
}

tasks.register('generateAutomation', JavaExec) {
    group = 'MAPAF AI'
    description = 'Generate MAPAF automation assets from a user story'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'core.ai.cli.GenerateAutomationTask'

    systemProperty 'story',
            project.findProperty('story') ?: ''

    systemProperty 'platform',
            project.findProperty('platform') ?: 'android'

    systemProperty 'screenName',
            project.findProperty('screenName') ?: 'GeneratedScreen'

    systemProperty 'acceptanceCriteria',
            project.findProperty('acceptanceCriteria')
                    ?: 'TODO_ACCEPTANCE_CRITERIA'

    systemProperty 'targetPackage',
            project.findProperty('targetPackage')
                    ?: 'mobile.generated'

    systemProperty 'outputDirectory',
            project.findProperty('outputDirectory')
                    ?: 'generated/ai/automation'

    systemProperty 'dryRun',
        project.findProperty('dryRun') ?: 'false'

    systemProperty 'hierarchyFile',
        project.findProperty('hierarchyFile') ?: ''
}

tasks.register('performanceMockApi', Exec) {
    group = 'MAPAF Performance'
    description = 'Starts the standalone performance mock API on port 8089'
    commandLine 'node', 'performance/mock-api/server.js'
}

tasks.register('performanceMockApiHealth', Exec) {
    group = 'MAPAF Performance'
    description = 'Checks the standalone performance mock API health endpoint'
    commandLine 'curl', '--fail', '--silent', '--show-error', 'http://localhost:8089/health'
}


def performanceBaseUrl = providers.gradleProperty('performanceBaseUrl').orElse('http://localhost:8089')

def configureJMeterEnvironment = { Exec task ->
    def configuredHome = project.findProperty('jmeterHome') ?: System.getenv('JMETER_HOME')
    def configuredBin = project.findProperty('jmeterBin') ?: System.getenv('JMETER_BIN')

    if (configuredHome) {
        task.environment 'JMETER_HOME', configuredHome.toString()
    }
    if (configuredBin) {
        task.environment 'JMETER_BIN', configuredBin.toString()
    }
    task.environment 'BASE_URL', performanceBaseUrl.get()
}

tasks.register('k6Smoke', Exec) {
    group = 'MAPAF Performance'
    description = 'Runs the k6 smoke demo against the performance mock API'
    environment 'BASE_URL', performanceBaseUrl.get()
    commandLine 'bash', 'performance/scripts/run-k6-demo.sh', 'smoke'
}

tasks.register('k6Load', Exec) {
    group = 'MAPAF Performance'
    description = 'Runs the k6 load demo against the performance mock API'
    environment 'BASE_URL', performanceBaseUrl.get()
    commandLine 'bash', 'performance/scripts/run-k6-demo.sh', 'load'
}

tasks.register('jmeterSmoke', Exec) {
    group = 'MAPAF Performance'
    description = 'Runs the JMeter smoke demo and generates the HTML dashboard'
    configureJMeterEnvironment(delegate)
    commandLine 'bash', 'performance/scripts/run-jmeter-demo.sh', 'smoke'
}

tasks.register('jmeterLoad', Exec) {
    group = 'MAPAF Performance'
    description = 'Runs the JMeter load demo and generates the HTML dashboard'
    configureJMeterEnvironment(delegate)
    commandLine 'bash', 'performance/scripts/run-jmeter-demo.sh', 'load'
}

tasks.register('performanceDemoSmoke', Exec) {
    group = 'MAPAF Performance'
    description = 'Starts the mock API and runs both k6 and JMeter smoke demos'
    configureJMeterEnvironment(delegate)
    commandLine 'bash', 'performance/scripts/run-performance-demo.sh', 'smoke'
}

tasks.register('performanceDemoLoad', Exec) {
    group = 'MAPAF Performance'
    description = 'Starts the mock API and runs both k6 and JMeter load demos'
    configureJMeterEnvironment(delegate)
    commandLine 'bash', 'performance/scripts/run-performance-demo.sh', 'load'
}

tasks.register('performanceDockerUp', Exec) {
    group = 'MAPAF Performance'
    description = 'Builds and starts the Dockerized performance mock API'
    commandLine 'bash', 'performance/scripts/docker-performance-up.sh'
}

tasks.register('performanceDockerDown', Exec) {
    group = 'MAPAF Performance'
    description = 'Stops the Dockerized performance demo services'
    commandLine 'bash', 'performance/scripts/docker-performance-down.sh'
}

tasks.register('performanceDemoSmokeDocker', Exec) {
    group = 'MAPAF Performance'
    description = 'Runs the mock API, k6 smoke, and JMeter smoke entirely with Docker'
    commandLine 'bash', 'performance/scripts/run-docker-performance-demo.sh', 'smoke'
}

tasks.register('performanceDemoLoadDocker', Exec) {
    group = 'MAPAF Performance'
    description = 'Runs the mock API, k6 load, and JMeter load entirely with Docker'
    commandLine 'bash', 'performance/scripts/run-docker-performance-demo.sh', 'load'
}

// Generates the unified MAPAF Quality Engineering Dashboard.
tasks.register('qualityReport', Exec) {
    group = 'MAPAF Dashboard'
    description = 'Generates the unified API and performance quality dashboard'
    commandLine 'bash', 'performance/scripts/generate-quality-dashboard.sh'
}

// Compatibility alias retained for existing documentation and commands.
tasks.register('performanceReport') {
    group = 'MAPAF Dashboard'
    description = 'Compatibility alias for the unified MAPAF quality report'
    dependsOn 'qualityReport'
}

// Starts or reuses a background HTTP server and opens the unified dashboard.
tasks.register('frameworkDashboard', Exec) {
    group = 'MAPAF Dashboard'
    description = 'Generates, serves, and opens the unified MAPAF quality dashboard using an available port'
    dependsOn 'qualityReport'

    environment 'PERFORMANCE_REPORT_PORT',
            project.findProperty('performanceReportPort') ?: '8090'
    environment 'PERFORMANCE_REPORT_MAX_PORT',
            project.findProperty('performanceReportMaxPort') ?: '8110'

    commandLine 'bash', 'performance/scripts/manage-performance-report-server.sh', 'open'
}

// Starts or reuses the background report server without opening a browser.
tasks.register('servePerformanceReport', Exec) {
    group = 'MAPAF Dashboard'
    description = 'Generates and serves the unified quality dashboard in the background using an available port'
    dependsOn 'qualityReport'

    environment 'PERFORMANCE_REPORT_PORT',
            project.findProperty('performanceReportPort') ?: '8090'
    environment 'PERFORMANCE_REPORT_MAX_PORT',
            project.findProperty('performanceReportMaxPort') ?: '8110'

    commandLine 'bash', 'performance/scripts/manage-performance-report-server.sh', 'serve'
}

// Opens the dashboard, reusing or starting the managed report server when required.
tasks.register('openPerformanceReportHttp', Exec) {
    group = 'MAPAF Dashboard'
    description = 'Opens the HTTP-served MAPAF quality dashboard'
    dependsOn 'qualityReport'

    environment 'PERFORMANCE_REPORT_PORT',
            project.findProperty('performanceReportPort') ?: '8090'
    environment 'PERFORMANCE_REPORT_MAX_PORT',
            project.findProperty('performanceReportMaxPort') ?: '8110'

    commandLine 'bash', 'performance/scripts/manage-performance-report-server.sh', 'open'
}

// Stops only the report server started by MAPAF.
tasks.register('stopPerformanceReportServer', Exec) {
    group = 'MAPAF Dashboard'
    description = 'Stops the MAPAF-managed quality dashboard server'
    commandLine 'bash', 'performance/scripts/manage-performance-report-server.sh', 'stop'
}

// Runs API tests and then opens the unified quality dashboard.
tasks.register('qualityDashboard') {
    group = 'MAPAF Dashboard'
    description = 'Runs API tests and opens the unified MAPAF quality dashboard'
    dependsOn 'apiTest'
    finalizedBy 'frameworkDashboard'
}

// Compatibility alias. Uses HTTP rather than file:// to avoid Safari local-file restrictions.
tasks.register('openPerformanceReport') {
    group = 'MAPAF Dashboard'
    description = 'Generates, serves, and opens the MAPAF quality dashboard'
    dependsOn 'openPerformanceReportHttp'
}

// Runs both smoke engines and refreshes the unified performance dashboard.
tasks.register('performanceDashboardSmoke') {
    group = 'MAPAF Performance'
    description = 'Runs the combined smoke demo and generates the unified performance dashboard'
    dependsOn 'performanceDemoSmoke'
    finalizedBy 'performanceReport'
}

// Runs both load engines and refreshes the unified performance dashboard.
tasks.register('performanceDashboardLoad') {
    group = 'MAPAF Performance'
    description = 'Runs the combined load demo and generates the unified performance dashboard'
    dependsOn 'performanceDemoLoad'
    finalizedBy 'performanceReport'
}
