// Generates the unified MAPAF Quality Engineering Dashboard.
tasks.register('qualityReport', Exec) {
    group = 'MAPAF Dashboard'
    description = 'Generates the unified API and performance quality dashboard'
    commandLine 'bash', 'performance/scripts/generate-quality-dashboard.sh'
}

// Compatibility alias retained for existing documentation and commands.
tasks.register('performanceReport') {
    group = 'MAPAF Dashboard'
    description = 'Compatibility alias for the unified MAPAF quality report'
    dependsOn 'qualityReport'
}

// Starts or reuses a background HTTP server and opens the unified dashboard.
tasks.register('frameworkDashboard', Exec) {
    group = 'MAPAF Dashboard'
    description = 'Generates, serves, and opens the unified MAPAF quality dashboard using an available port'
    dependsOn 'qualityReport'

    environment 'PERFORMANCE_REPORT_PORT',
            project.findProperty('performanceReportPort') ?: '8090'
    environment 'PERFORMANCE_REPORT_MAX_PORT',
            project.findProperty('performanceReportMaxPort') ?: '8110'

    commandLine 'bash', 'performance/scripts/manage-performance-report-server.sh', 'open'
}

// Starts or reuses the background report server without opening a browser.
tasks.register('servePerformanceReport', Exec) {
    group = 'MAPAF Dashboard'
    description = 'Generates and serves the unified quality dashboard in the background using an available port'
    dependsOn 'qualityReport'

    environment 'PERFORMANCE_REPORT_PORT',
            project.findProperty('performanceReportPort') ?: '8090'
    environment 'PERFORMANCE_REPORT_MAX_PORT',
            project.findProperty('performanceReportMaxPort') ?: '8110'

    commandLine 'bash', 'performance/scripts/manage-performance-report-server.sh', 'serve'
}

// Opens the dashboard, reusing or starting the managed report server when required.
tasks.register('openPerformanceReportHttp', Exec) {
    group = 'MAPAF Dashboard'
    description = 'Opens the HTTP-served MAPAF quality dashboard'
    dependsOn 'qualityReport'

    environment 'PERFORMANCE_REPORT_PORT',
            project.findProperty('performanceReportPort') ?: '8090'
    environment 'PERFORMANCE_REPORT_MAX_PORT',
            project.findProperty('performanceReportMaxPort') ?: '8110'

    commandLine 'bash', 'performance/scripts/manage-performance-report-server.sh', 'open'
}

// Stops only the report server started by MAPAF.
tasks.register('stopPerformanceReportServer', Exec) {
    group = 'MAPAF Dashboard'
    description = 'Stops the MAPAF-managed quality dashboard server'
    commandLine 'bash', 'performance/scripts/manage-performance-report-server.sh', 'stop'
}

