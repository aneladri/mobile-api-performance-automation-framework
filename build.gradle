plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.10.2'

    testImplementation 'io.appium:java-client:9.4.0'

    testImplementation 'org.apache.logging.log4j:log4j-api:2.24.3'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.3'

    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    testImplementation 'io.rest-assured:json-schema-validator:5.5.0'

    testImplementation 'io.qameta.allure:allure-testng:2.29.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

tasks.withType(Test).configureEach {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useTestNG() {
        listeners.add("io.qameta.allure.testng.AllureTestNg")
    }

    systemProperty "allure.results.directory", "$buildDir/allure-results"

    outputs.upToDateWhen { false }
}

test {
    useTestNG() {
        suites 'testng.xml'
    }
}

tasks.register('apiTest', Test) {
    description = 'Runs API TestNG suite'
    group = 'verification'

    useTestNG() {
        suites 'testng-api.xml'
        listeners.add("io.qameta.allure.testng.AllureTestNg")
    }
}

tasks.register('mobileTest', Test) {
    description = 'Runs Mobile TestNG suite'
    group = 'verification'

    useTestNG() {
        suites 'testng-mobile.xml'
        listeners.add("io.qameta.allure.testng.AllureTestNg")
    }
}

tasks.register('regressionTest', Test) {
    description = 'Runs Regression TestNG suite'
    group = 'verification'

    useTestNG() {
        suites 'testng-regression.xml'
        listeners.add("io.qameta.allure.testng.AllureTestNg")
    }
}

tasks.register('iosTest', Test) {
    useTestNG() {
        suites 'testng-ios.xml'
    }

}

tasks.register('aiTest', Test) {
    useTestNG() {
        suites 'testng-ai.xml'
    }
}

tasks.register('flowDemoTest', Test) {
    description = 'Runs the multi-step Appium navigation flow demo'
    group = 'MAPAF Demo'

    testLogging {
        showStandardStreams = true
        events "standardOut", "standardError"
    }

    useTestNG() {
        suites 'testng-flow-demo.xml'
        listeners.add("io.qameta.allure.testng.AllureTestNg")
    }
}

tasks.register('failureDemoTest', Test) {
    description = 'Runs a deliberate, deterministic failure for showing a real failure report'
    group = 'MAPAF Demo'
    ignoreFailures = true

    testLogging {
        showStandardStreams = true
        events "standardOut", "standardError"
    }

    useTestNG() {
        suites 'testng-failure-demo.xml'
        listeners.add("io.qameta.allure.testng.AllureTestNg")
    }
}

tasks.register('healingDemoTest', Test) {
    description = 'Runs the Tier 3 AI self-healing demo test'
    group = 'MAPAF Demo'

    systemProperty "waitTimeoutSeconds", project.findProperty("waitTimeoutSeconds") ?: "15"

    testLogging {
        showStandardStreams = true
        events "standardOut", "standardError"
    }

    useTestNG() {
        suites 'testng-healing-demo.xml'
        listeners.add("io.qameta.allure.testng.AllureTestNg")
    }
}

tasks.register('generateAutomation', JavaExec) {
    group = 'MAPAF AI'
    description = 'Generate MAPAF automation assets from a user story'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'core.ai.cli.GenerateAutomationTask'

    systemProperty 'story',
            project.findProperty('story') ?: ''

    systemProperty 'platform',
            project.findProperty('platform') ?: 'android'

    systemProperty 'screenName',
            project.findProperty('screenName') ?: 'GeneratedScreen'

    systemProperty 'acceptanceCriteria',
            project.findProperty('acceptanceCriteria')
                    ?: 'TODO_ACCEPTANCE_CRITERIA'

    systemProperty 'targetPackage',
            project.findProperty('targetPackage')
                    ?: 'mobile.generated'

    systemProperty 'outputDirectory',
            project.findProperty('outputDirectory')
                    ?: 'generated/ai/automation'

    systemProperty 'dryRun',
        project.findProperty('dryRun') ?: 'false'                
}
