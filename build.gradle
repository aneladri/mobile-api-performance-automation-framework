tasks.register('reportingTest', Test) {
    description = 'Runs common reporting framework tests'
    group = 'verification'

    useTestNG {
        suites 'testng-reporting.xml'
    }

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

def configuredRetryCount =
        (project.findProperty('retryCount') ?: '0')
                .toString()

def supportedWebBrowsers = [
        'CHROMIUM',
        'FIREFOX',
        'WEBKIT'
]

def configuredBrowserSelection =
        (project.findProperty('browser') ?: 'CHROMIUM')
                .toString()
                .trim()
                .toUpperCase()

def selectedWebBrowsers = configuredBrowserSelection == 'ALL'
        ? supportedWebBrowsers
        : configuredBrowserSelection
                .split(',')
                .collect { it.trim() }
                .findAll { !it.isEmpty() }

def unsupportedWebBrowsers =
        selectedWebBrowsers.findAll {
            !supportedWebBrowsers.contains(it)
        }
def browserTestTaskByName = [
        CHROMIUM: 'webChromiumTest',
        FIREFOX : 'webFirefoxTest',
        WEBKIT  : 'webWebkitTest'
]

def browserSummaryTaskByName = [
        CHROMIUM: 'generateChromiumWebSummary',
        FIREFOX : 'generateFirefoxWebSummary',
        WEBKIT  : 'generateWebkitWebSummary'
]

def configuredEnvironment =
        (project.findProperty('environment')
                ?: System.getenv('TEST_ENVIRONMENT')
                ?: 'LOCAL')
                .toString()

def configuredBuildNumber =
        (project.findProperty('buildNumber')
                ?: System.getenv('BUILD_NUMBER')
                ?: System.getenv('BUILD_BUILDNUMBER')
                ?: 'local')
                .toString()

def configuredBranch =
        (project.findProperty('branch')
                ?: System.getenv('GIT_BRANCH')
                ?: System.getenv('BUILD_SOURCEBRANCHNAME')
                ?: 'local')
                .toString()

def configuredCommit =
        (project.findProperty('commit')
                ?: System.getenv('GIT_COMMIT')
                ?: System.getenv('BUILD_SOURCEVERSION')
                ?: 'local')
                .toString()  

def configuredOpenDashboard =
        (project.findProperty('openDashboard') ?: 'true')
                .toString()
                .toBoolean()                                    

