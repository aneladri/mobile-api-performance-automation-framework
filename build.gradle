if (selectedWebBrowsers.isEmpty()) {
    throw new GradleException(
            'Browser selection cannot be empty. Supported values: '
                    + supportedWebBrowsers.join(', ')
                    + ', ALL'
    )
}

if (!unsupportedWebBrowsers.isEmpty()) {
    throw new GradleException(
            'Unsupported browser selection: '
                    + unsupportedWebBrowsers.join(', ')
                    + '. Supported values: '
                    + supportedWebBrowsers.join(', ')
                    + ', ALL'
    )
}

tasks.register('webTest', Test) {
    description = 'Runs Web TestNG suite'
    group = 'verification'

    useTestNG {
        suites 'testng-web.xml'

        if (project.hasProperty('webParallel')
                && project.property('webParallel') == 'true') {

            parallel = 'methods'

            threadCount = (
                    project.findProperty('webThreads') ?: '4'
            ).toInteger()
        }
    }

    systemProperty 'web.parallel',
            project.findProperty('webParallel') ?: 'false'

    systemProperty 'web.threads',
            project.findProperty('webThreads') ?: '4'

    systemProperty 'mapaf.retry.count',
            configuredRetryCount

    systemProperty 'mapaf.environment', configuredEnvironment
    systemProperty 'mapaf.build', configuredBuildNumber
    systemProperty 'mapaf.branch', configuredBranch
    systemProperty 'mapaf.commit', configuredCommit    

    testLogging {
    events 'passed', 'failed', 'skipped'
    exceptionFormat 'full'
    showStandardStreams = true
    }

    doFirst {
        println 'Web execution configuration:'
        println "  Threads     : ${project.findProperty('webThreads') ?: '4'}"
        println "  Retry       : ${configuredRetryCount}"
        println "  Environment : ${configuredEnvironment}"
    }    
}

tasks.register('webParallelTest', Test) {
    description = 'Runs Playwright Web tests in parallel'
    group = 'verification'

    dependsOn testClasses

    maxParallelForks = 1

    def configuredThreads =
            (project.findProperty('webThreads') ?: '4')
                    .toString()

    def configuredHeadless =
            (project.findProperty('headless') ?: 'true')
                    .toString()

    def configuredBrowser =
            (project.findProperty('browser') ?: 'CHROMIUM')
                    .toString()
                    .trim()
                    .toUpperCase()

    useTestNG {
        suites 'testng-web-parallel.xml'
        parallel = 'methods'
        threadCount = configuredThreads.toInteger()
    }

    systemProperty 'web.parallel', 'true'
    systemProperty 'web.threads', configuredThreads
    systemProperty 'web.headless', configuredHeadless
    systemProperty 'web.browser', configuredBrowser
    systemProperty 'mapaf.retry.count', configuredRetryCount

    systemProperty 'mapaf.environment', configuredEnvironment
    systemProperty 'mapaf.build', configuredBuildNumber
    systemProperty 'mapaf.branch', configuredBranch
    systemProperty 'mapaf.commit', configuredCommit

    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = true
    }

    doFirst {
        println 'Web parallel execution configuration:'
        println "  Threads  : ${configuredThreads}"
        println "  Headless : ${configuredHeadless}"
        println "  Browser  : ${configuredBrowser}"
        println "  Retry    : ${configuredRetryCount}"
    }
}

def crossBrowserDefinitions = [
        [taskName: 'webChromiumTest', browser: 'CHROMIUM'],
        [taskName: 'webFirefoxTest',  browser: 'FIREFOX'],
        [taskName: 'webWebkitTest',   browser: 'WEBKIT']
]

crossBrowserDefinitions.each { definition ->

    tasks.register(definition.taskName, Test) {
        description =
                "Runs Playwright Web tests on ${definition.browser}"

        group = 'verification'

        dependsOn testClasses

        maxParallelForks = 1

        def configuredThreads =
                (project.findProperty('webThreads') ?: '4')
                        .toString()

        def configuredHeadless =
                (project.findProperty('headless') ?: 'true')
                        .toString()

        useTestNG {
            suites 'testng-web-parallel.xml'
            parallel = 'methods'
            threadCount = configuredThreads.toInteger()
        }

        systemProperty 'web.parallel', 'true'
        systemProperty 'web.threads', configuredThreads
        systemProperty 'web.headless', configuredHeadless
        systemProperty 'web.browser', definition.browser
        systemProperty 'mapaf.retry.count', configuredRetryCount

        systemProperty 'mapaf.environment', configuredEnvironment
        systemProperty 'mapaf.build', configuredBuildNumber
        systemProperty 'mapaf.branch', configuredBranch
        systemProperty 'mapaf.commit', configuredCommit

        testLogging {
            events 'passed', 'failed', 'skipped'
            exceptionFormat 'full'
            showStandardStreams = true
        }

        doFirst {
            println 'MAPAF cross-browser execution configuration:'
            println "  Task     : ${definition.taskName}"
            println "  Browser  : ${definition.browser}"
            println "  Threads  : ${configuredThreads}"
            println "  Headless : ${configuredHeadless}"
            println "  Retry    : ${configuredRetryCount}"
        }
    }
}

tasks.register('webCrossBrowserTest') {
    description =
            'Runs the Playwright Web suite across Chromium, Firefox and WebKit'

    group = 'verification'

    dependsOn(
            'webChromiumTest',
            'webFirefoxTest',
            'webWebkitTest'
    )

    doLast {
