tasks.register('generateAutomation', JavaExec) {
    group = 'MAPAF AI'
    description = 'Generate MAPAF automation assets from a user story'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'core.ai.cli.GenerateAutomationTask'

    systemProperty 'story',
            project.findProperty('story') ?: ''

    systemProperty 'platform',
            project.findProperty('platform') ?: 'android'

    systemProperty 'screenName',
            project.findProperty('screenName') ?: 'GeneratedScreen'

    systemProperty 'acceptanceCriteria',
            project.findProperty('acceptanceCriteria')
                    ?: 'TODO_ACCEPTANCE_CRITERIA'

    systemProperty 'targetPackage',
            project.findProperty('targetPackage')
                    ?: 'mobile.generated'

    systemProperty 'outputDirectory',
            project.findProperty('outputDirectory')
                    ?: 'generated/ai/automation'

    systemProperty 'dryRun',
        project.findProperty('dryRun') ?: 'false'

    // Code generation requires a larger output budget than short AI requests.
    systemProperty 'claude.max.tokens',
            project.findProperty('claudeMaxTokens')
                    ?: System.getenv('CLAUDE_MAX_TOKENS')
                    ?: '8192'

    systemProperty 'claude.timeout.seconds',
            project.findProperty('claudeTimeoutSeconds')
                    ?: System.getenv('CLAUDE_TIMEOUT_SECONDS')
                    ?: '120'

    systemProperty 'hierarchyFile',
        project.findProperty('hierarchyFile') ?: ''
}

