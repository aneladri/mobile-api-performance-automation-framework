plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.10.2'

    testImplementation 'io.appium:java-client:9.4.0'

    testImplementation 'org.apache.logging.log4j:log4j-api:2.24.3'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.3'

    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    testImplementation 'io.rest-assured:json-schema-validator:5.5.0'

    testImplementation 'io.qameta.allure:allure-testng:2.29.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'org.wiremock:wiremock-standalone:3.13.1'
    testImplementation 'com.microsoft.playwright:playwright:1.55.0'
}

tasks.withType(Test).configureEach {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useTestNG() {
    }

    systemProperty "allure.results.directory", "$buildDir/allure-results"

    outputs.upToDateWhen { false }
}

test {
    useTestNG() {
        suites 'testng.xml'
    }
}

