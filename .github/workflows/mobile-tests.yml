name: Mobile Tests

on:
  workflow_dispatch:

  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  mobile-compile:
    name: Compile Mobile Framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Compile test classes
        run: ./gradlew clean compileTestJava

      - name: Upload Gradle problem reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-compile-reports
          path: build/reports
