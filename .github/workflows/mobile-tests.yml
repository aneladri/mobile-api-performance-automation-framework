name: Mobile Tests

on:
  workflow_dispatch:
    inputs:
      run_mobile_tests:
        description: Run actual mobile tests
        required: true
        default: 'true'

  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  mobile-compile:
    name: Compile Mobile Framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Compile test classes
        run: ./gradlew clean compileTestJava

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-compile-reports
          path: build/reports

  mobile-tests:
    name: Run Mobile Tests
    runs-on: ubuntu-latest
    needs: mobile-compile
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run mobile tests
        run: ./gradlew mobileTest

      - name: Upload mobile test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-reports
          path: build/reports