name: BrowserStack Mobile Tests

on:
  workflow_dispatch:

jobs:
  browserstack-mobile-tests:
    name: Run Mobile Tests on BrowserStack
    runs-on: ubuntu-latest

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run BrowserStack mobile tests
        run: ./gradlew clean mobileTest -Dexecution=browserstack

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-allure-results
          path: build/allure-results

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-gradle-report
          path: build/reports/tests/mobileTest